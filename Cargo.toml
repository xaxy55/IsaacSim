[workspace]
resolver = "2"
members = [
    "crates/isaacsim-asset-urdf",
    "crates/isaacsim-core-cloner",
    "crates/isaacsim-core-math",
    "crates/isaacsim-core-version",
    "crates/isaacsim-robot-wheeled",
    "crates/isaacsim-scene",
    "crates/isaacsim-usd",
    "crates/isaacsim-app",
]

[workspace.package]
version = "6.0.0-rc.59"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/xaxy55/isaacsim"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
